name: Starfall core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update && sudo apt-get install -y mono-mcs python3-pil
      # Always test the same fully regenerated candidate textures that the
      # guarded publication job will ship. Otherwise a Sprite frame-count
      # migration would fail against the stale committed PNGs and deadlock
      # its own publisher. The source art and meta GUIDs remain unchanged.
      - name: Build three-class canonical hero animation preview / QA matrix
        run: python3 tools/build_hero_animation_preview.py
      - name: Export 63 source-authored production hero Sprite atlases
        run: python3 tools/export_canonical_hero_atlases.py
      - name: Hard-gate fake/reused Attack and Cast contact drawings; report 18 missing art slots
        run: python3 tools/check_hero_contact_art.py
      - name: Enforce 18 unique integrated contacts for an explicit art-release candidate
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(hero-contacts):') }}
        run: python3 tools/check_hero_contact_art.py --release
      - name: Stage regenerated canonical hero Sprite resources for live bridge checks
        run: |
          python3 tools/install_canonical_hero_atlases.py
          python3 tools/check_installed_hero_atlases.py
      - name: Run actual C# gameplay checks
        run: python3 tools/run_core_tests.py
      - name: Check production combat input with offline Unity declarations
        run: python3 tools/run_combat_input_checks.py
      - name: Sprite animation QA - original hero, Boss cues and remastered PNGs
        run: python3 tools/check_visual_sprites.py
      - name: Enforce single-class waist/palette/proportion QA for all Sprite cells
        run: python3 tools/check_hero_whole_body_integrity.py
      - name: Hard-fail real installed full-body connectedness, boots, gold identity and Sprite GUID regressions
        run: python3 tools/check_hero_production_anatomy.py
      - name: Audit production Sprite continuity and emit Game View comparison GIFs
        run: python3 tools/check_hero_runtime_continuity.py
      - name: Require byte-exact source-authored hero animations with zero body warps
        run: python3 tools/check_hero_generated_motion.py
      - name: Audit locked hero visual identity, registered hand hints and foot anchor
        run: python3 tools/check_hero_visual_spec.py
      - name: Check live SpriteRenderer hero bridge and accepted sources
        run: python3 tools/check_live_sprite_bridge.py
      - name: Audit three-class animation frame continuity and provenance
        run: python3 tools/check_hero_temporal_qa.py
      - name: Preserve sprite QA filmstrips, onion-skins and GIFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-sprite-qa
          path: |
            .starfall-checks/sprite-qa/
            .starfall-checks/hero-animation-qa/
            .starfall-checks/hero-production-atlases/
            .starfall-checks/hero-runtime-qa/
          if-no-files-found: ignore

  publish-approved-hero-sprites:
    # One-shot, explicitly marked development handoff. A GITHUB_TOKEN push
    # does not spawn another CI run. Do not create an autonomous commit loop.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/dev' && (contains(github.event.head_commit.message, '[publish-hero-art]') || startsWith(github.event.head_commit.message, 'release(hero-contacts):')) }}
    needs: core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and inspect actual three-class production sheets
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil python3-fonttools
          python3 tools/build_hero_animation_preview.py
          python3 tools/export_canonical_hero_atlases.py
          python3 tools/check_hero_generated_motion.py
          python3 tools/check_hero_whole_body_integrity.py
          python3 tools/check_hero_visual_spec.py
          python3 tools/install_canonical_hero_atlases.py
          # The checkout intentionally does not hydrate unrelated Git LFS art.
          # Validate the 63 freshly installed production textures instead.
          python3 tools/check_installed_hero_atlases.py
          python3 tools/check_hero_runtime_continuity.py
      - name: Enforce 18 installed original-contact drawings for final art-release tag
        if: ${{ startsWith(github.event.head_commit.message, 'release(hero-contacts):') }}
        run: python3 tools/check_hero_contact_art.py --release
      - name: Safe fast-forward publish into the ONLY writable branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin chatgpt/dev
          current="$(git rev-parse refs/remotes/origin/chatgpt/dev)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Concurrent developer advanced chatgpt/dev: refusing stale asset publication."
            exit 1
          fi
          git add -- Assets/Resources/Frontier/HeroAnimator.meta \
            Assets/Resources/Frontier/HeroAnimator/Canonical.meta \
            Assets/Resources/Frontier/HeroAnimator/Canonical/
          if git diff --cached --quiet; then
            echo "All production sheets already published; nothing to commit."
            exit 0
          fi
          git -c user.name='Starfall AI-2' \
              -c user.email='71573141+jinze909@users.noreply.github.com' \
            commit -m 'feat(hero-art): integrate 63 verified Sprite sheets and Unity meta [published-hero-art]'
          git fetch --no-tags origin chatgpt/dev
          refreshed="$(git rev-parse refs/remotes/origin/chatgpt/dev)"
          if [ "$refreshed" != "$current" ]; then
            echo "Remote advanced before upload: refusing force push."
            exit 1
          fi
          git push origin HEAD:refs/heads/chatgpt/dev
